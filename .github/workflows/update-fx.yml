name: Update FX data

on:
  schedule:
    # FRED publishes the H.10 daily rates weekly (Monday 4:15 p.m. ET, next business day after a holiday).
    # Runs Tue-Sat 00:17 UTC (09:17 KST). Data are committed and the dashboard redeployed only when new values appear.
    - cron: "17 0 * * 2-6"
  workflow_dispatch: {}
  # Also run when the collector, analysis or dashboard changes (bot data commits do not trigger runs).
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "config/**"
      - "docs/**"
      - "requirements.txt"
      - ".github/workflows/update-fx.yml"

permissions:
  contents: write

concurrency:
  group: update-fx
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download and aggregate
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/update_fx.py

      - name: Build dashboard data
        run: python scripts/analyze_fx.py

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            last=$(python -c "import json;print(json.load(open('data/metadata.json'))['last_observation'])")
            git commit -m "Update FX data through ${last}"
            git push || (git pull --rebase origin main && git push)
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: update
    # Scheduled runs redeploy only when data changed; pushes and manual runs always redeploy.
    if: needs.update.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
